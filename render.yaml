services:
  - type: web
    name: handover-shipments
    runtime: python
    plan: starter            # always-on, so the OAuth flow never cold-starts mid-login
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: python app.py
    envVars:
      - key: ACU_BASE_URL
        value: https://sandandfog.acumatica.com
      - key: ACU_TENANT           # live tenant name
        sync: false
      - key: ACU_CLIENT_ID        # live connected-app client id
        sync: false
      - key: ACU_CLIENT_SECRET    # live connected-app shared secret
        sync: false
      - key: APP_PASSWORD         # login password for the tool
        sync: false
      - key: PUBLIC_URL           # the https URL Render gives this service
        sync: false
      - key: WAREHOUSE_ID         # optional ship-from warehouse (blank = sales order default)
        sync: false
      - key: SHIP_CONTAINER_FIELD # optional: shipment container UDF (from Diagnostics)
        sync: false
      - key: AUTOSHIP_TOKEN       # write-capable bearer token for /autoship (NRT + Maersk/FCR automation) -- keep separate from any read-only token
        sync: false
      - key: FCR_TOKEN            # bearer token for /parsefcr (read-only PDF parse, no Acumatica writes); falls back to AUTOSHIP_TOKEN if unset
        sync: false
      - key: MAERSK_TOKEN         # bearer token for /checkmaersk (read-only, no Acumatica calls); falls back to FCR_TOKEN if unset
        sync: false
      - key: TOKEN_DIR
        value: /var/data
    disk:
      name: ship-data
      mountPath: /var/data
      sizeGB: 1
