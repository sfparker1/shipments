services:
  - type: web
    name: handover-shipments
    runtime: python
    plan: starter            # always-on, so the OAuth flow never cold-starts mid-login
    # NOTE: no --with-deps here -- that flag needs apt/root access to install OS-level
    # shared libraries, which Render's native Python build environment doesn't grant (it
    # tried `su` and got an authentication failure on first attempt). This installs just
    # the browser binary; if /checkmaersk fails at RUNTIME (not build time) with a missing
    # shared-library error, this environment can't satisfy Playwright's system deps and the
    # next step is switching this service to a Docker deploy using Microsoft's official
    # Playwright image (mcr.microsoft.com/playwright/python), which ships everything
    # preinstalled -- a bigger change, don't attempt until this simpler option is ruled out.
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python app.py
    envVars:
      - key: ACU_BASE_URL
        value: https://sandandfog.acumatica.com
      - key: ACU_TENANT           # live tenant name
        sync: false
      - key: ACU_CLIENT_ID        # live connected-app client id
        sync: false
      - key: ACU_CLIENT_SECRET    # live connected-app shared secret
        sync: false
      - key: APP_PASSWORD         # login password for the tool
        sync: false
      - key: PUBLIC_URL           # the https URL Render gives this service
        sync: false
      - key: WAREHOUSE_ID         # optional ship-from warehouse (blank = sales order default)
        sync: false
      - key: SHIP_CONTAINER_FIELD # optional: shipment container UDF (from Diagnostics)
        sync: false
      - key: AUTOSHIP_TOKEN       # write-capable bearer token for /autoship (NRT + Maersk/FCR automation) -- keep separate from any read-only token
        sync: false
      - key: FCR_TOKEN            # bearer token for /parsefcr (read-only PDF parse, no Acumatica writes); falls back to AUTOSHIP_TOKEN if unset
        sync: false
      - key: MAERSK_TOKEN         # bearer token for /checkmaersk + /watchlist/* (read-only, no Acumatica calls); falls back to FCR_TOKEN if unset
        sync: false
      - key: WATCHLIST_SLA_DAYS   # containers watching longer than this without a Load-on event flip to "alert" -- default 45
        value: "45"
      # =0 installs the browser INSIDE the playwright package (site-packages) instead of a
      # separate ~/.cache dir -- the cache dir doesn't survive Render's build->run boundary,
      # site-packages does. Not a secret, so a fixed value (not sync: false) is correct here.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: TOKEN_DIR
        value: /var/data
    disk:
      name: ship-data
      mountPath: /var/data
      sizeGB: 1
